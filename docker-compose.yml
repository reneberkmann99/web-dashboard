services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostpanel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - hostpanel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/hostpanel?schema=public"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      NODE_CREDENTIALS_KEY: "${NODE_CREDENTIALS_KEY}"
      DEPLOYMENT_SECRETS_KEY: "${DEPLOYMENT_SECRETS_KEY:-}"
      HOSTPANEL_AGENT_CA_CERT_PATH: "${HOSTPANEL_AGENT_CA_CERT_PATH:-/data/pki/hostpanel-agent-ca.pem}"
      HOSTPANEL_AGENT_CA_KEY_PATH: "${HOSTPANEL_AGENT_CA_KEY_PATH:-/data/pki/hostpanel-agent-ca-key.pem}"
      NODE_AGENT_TIMEOUT_MS: "${NODE_AGENT_TIMEOUT_MS:-15000}"
      NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-Noderaft}"
      # Next standalone otherwise inherits Docker's container hostname and
      # binds only that transient IP, making localhost health probes fail.
      HOSTNAME: "0.0.0.0"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      HOSTPANEL_PUBLIC_BASE_URL: "${HOSTPANEL_PUBLIC_BASE_URL:-https://localhost:1337}"
      NOTIFICATION_DESTINATIONS_KEY: "${NOTIFICATION_DESTINATIONS_KEY:-}"
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: "${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}"
      WEBHOOK_TIMEOUT_MS: "${WEBHOOK_TIMEOUT_MS:-8000}"
      PAM_BRIDGE_URL: "${PAM_BRIDGE_URL:-}"
      PAM_BRIDGE_KEY: "${PAM_BRIDGE_KEY:-}"
      PAM_ADMIN_USERS: "${PAM_ADMIN_USERS:-rene}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Agent CA material (private key 0600) — persisted outside the image and
      # outside Postgres. BACK THIS UP: see scripts/bootstrap-agent-ca.ts.
      - hostpanel-ca-data:/data/pki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # VPN-facing TLS boundary. The application container is private to this
  # Compose network; nginx overwrites forwarded headers before proxying, so
  # browser-supplied X-Forwarded-* values are never trusted directly.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "1337:8443"
    volumes:
      - ./deploy/nginx/hostpanel.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOSTPANEL_TLS_DIR:-/etc/hostpanel/tls}:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_PORT: "8081"
      AGENT_TLS_PORT: "9081"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      AGENT_ENROLL_TOKEN: "${AGENT_ENROLL_TOKEN:-}"
      CONTROL_PLANE_URL: "${CONTROL_PLANE_URL:-}"
      AGENT_KEY_FILE: "/data/agent.key"
      AGENT_STATE_DIR: "/data/state"
      AGENT_DOCKER_MODE: "${AGENT_DOCKER_MODE:-mock}"
      DOCKER_HOST: "${DOCKER_HOST:-}"
      XDG_RUNTIME_DIR: "${XDG_RUNTIME_DIR:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - hostpanel-agent-data:/data

  agent-rootless:
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_PORT: "8082"
      AGENT_TLS_PORT: "9082"
      AGENT_API_KEY: "${AGENT_ROOTLESS_API_KEY:-}"
      AGENT_ENROLL_TOKEN: "${AGENT_ROOTLESS_ENROLL_TOKEN:-}"
      CONTROL_PLANE_URL: "${CONTROL_PLANE_URL:-}"
      AGENT_KEY_FILE: "/data/agent.key"
      AGENT_STATE_DIR: "/data/state"
      AGENT_DOCKER_MODE: "rootless"
      DOCKER_HOST: "unix:///run/rootless.sock"
      XDG_RUNTIME_DIR: ""
    volumes:
      - /home/lenel/.docker/run/docker.sock:/run/rootless.sock:rw
      - hostpanel-agent-rootless-data:/data

volumes:
  hostpanel_pg:
  hostpanel-ca-data:
  hostpanel-agent-data:
  hostpanel-agent-rootless-data:
