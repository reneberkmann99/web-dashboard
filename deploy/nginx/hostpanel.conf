server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/hostpanel.crt;
    ssl_certificate_key /etc/nginx/tls/hostpanel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HostPanelTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Private self-signed deployments deliberately omit HSTS: a certificate
    # trust/rotation mistake should not pin the operator into a broken state.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    client_max_body_size 5m;

    # LogViewer SSE: never buffer/cache/compress the event stream. The long
    # read timeout permits quiet streams without causing artificial reconnects
    # or replaying the initial tail.
    location ~ ^/api/(admin|client)/containers/.*/logs/stream$ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
